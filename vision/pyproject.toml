[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maestro-vision-sidecar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "numpy",
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.0",
  "pillow",
  "uvicorn",
]

[project.optional-dependencies]
test = [
  "httpx2",
  "pytest",
]

[project.scripts]
maestro-vision-sidecar = "maestro_vision.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["maestro_vision"]

[tool.uv.sources]
paddlepaddle = { index = "paddle-cpu" }

[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true
