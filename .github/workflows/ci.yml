name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test --exclude '**/.worktrees/**'

  python:
    name: Python and real OCR
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PADDLE_PDX_MODEL_SOURCE: huggingface
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: vision/uv.lock
      - run: uv sync --project vision --locked --extra test
      - run: uv run --project vision --no-sync pytest -v vision/tests
